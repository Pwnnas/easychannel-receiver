<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>EasyChannel IPTV Cast Receiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #041E3E;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        cast-media-player {
            width: 100vw;
            height: 100vh;
            --theme-hue: 45; /* Golden Accent */
            --splash-image: none;
            --watermark-image: none;
        }

        #channel-overlay {
            position: absolute;
            top: 48px;
            left: 48px;
            display: flex;
            align-items: center;
            background: rgba(16, 40, 69, 0.85);
            backdrop-filter: blur(12px);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        #channel-overlay.visible {
            opacity: 1;
        }

        #channel-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-right: 16px;
            border-radius: 8px;
            display: none;
        }

        #channel-title {
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        #channel-status {
            color: #FFD166;
            font-size: 18px;
            font-weight: 500;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="channel-overlay">
        <img id="channel-logo" alt="">
        <div>
            <div id="channel-title">EasyChannel IPTV</div>
            <div id="channel-status">Ansluten</div>
        </div>
    </div>

    <cast-media-player id="media-player"></cast-media-player>

    <script>
        const CUSTOM_CHANNEL = 'urn:x-cast:com.easychannel.iptv';
        const LEGACY_CHANNEL = 'urn:x-cast:com.senioriptv';
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        let hideOverlayTimer = null;
        function showOverlay(title, status, logoUrl, durationMs = 6000) {
            const overlay = document.getElementById('channel-overlay');
            const titleEl = document.getElementById('channel-title');
            const statusEl = document.getElementById('channel-status');
            const logoEl = document.getElementById('channel-logo');

            titleEl.textContent = title || 'EasyChannel IPTV';
            statusEl.textContent = status || '';

            if (logoUrl) {
                logoEl.src = logoUrl;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }

            overlay.classList.add('visible');
            if (hideOverlayTimer) clearTimeout(hideOverlayTimer);
            if (durationMs > 0) {
                hideOverlayTimer = setTimeout(() => overlay.classList.remove('visible'), durationMs);
            }
        }

        function broadcastTrackList() {
            try {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const active = audioManager.getActiveTrack();

                const payload = {
                    type: 'TRACKS_UPDATE',
                    tracks: tracks.map(t => ({
                        id: t.trackId,
                        language: t.language || '',
                        name: t.name || t.language || `Spår ${t.trackId}`,
                        isSelected: active ? (t.trackId === active.trackId) : false
                    }))
                };

                console.log('[EasyChannel IPTV Receiver] Broadcasting tracks:', payload);
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, payload);
                context.sendCustomMessage(LEGACY_CHANNEL, undefined, payload);
            } catch (err) {
                console.warn('[EasyChannel IPTV Receiver] Could not broadcast tracks:', err);
            }
        }

        function normalizeLang(code) {
            if (!code) return '';
            const clean = String(code).trim().toLowerCase().replace('_', '-');
            const synonyms = {
                'sv': 'swe', 'swe': 'swe',
                'no': 'nor', 'nor': 'nor', 'nob': 'nor', 'nno': 'nor',
                'da': 'dan', 'dan': 'dan',
                'fi': 'fin', 'fin': 'fin',
                'en': 'eng', 'eng': 'eng',
                'de': 'deu', 'ger': 'deu', 'deu': 'deu',
                'fr': 'fra', 'fre': 'fra', 'fra': 'fra',
                'es': 'spa', 'spa': 'spa',
                'it': 'ita', 'ita': 'ita',
                'nl': 'nld', 'dut': 'nld', 'nld': 'nld',
                'pl': 'pol', 'pol': 'pol',
                'ru': 'rus', 'rus': 'rus'
            };
            if (synonyms[clean]) return synonyms[clean];
            const prefix2 = clean.substring(0, 2);
            if (synonyms[prefix2]) return synonyms[prefix2];
            return clean;
        }

        function matchLang(code1, code2) {
            if (!code1 && !code2) return true;
            if (!code1 || !code2) return false;
            const c1 = String(code1).trim().toLowerCase();
            const c2 = String(code2).trim().toLowerCase();
            if (c1 === c2) return true;
            const n1 = normalizeLang(c1);
            const n2 = normalizeLang(c2);
            if (n1 && n1 === n2) return true;
            if ((c1.length >= 2 && c2.length >= 2) && (c1.startsWith(c2 + '-') || c2.startsWith(c1 + '-'))) return true;
            return false;
        }

        let preferredLanguage = '';
        let diagnosticTimers = [];

        // Intercept LOAD request to read metadata and preferred audio
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, loadRequestData => {
            console.log('[EasyChannel IPTV Receiver] LOAD RECEIVED', JSON.stringify(loadRequestData));
            const media = loadRequestData.media;
            if (media) {
                if (media.contentUrl && media.contentUrl.endsWith('.ts')) {
                    media.contentUrl = media.contentUrl.replace(/\.ts$/, '.m3u8');
                    media.contentType = 'application/x-mpegurl';
                }
                if (media.contentId && media.contentId.endsWith('.ts')) {
                    media.contentId = media.contentId.replace(/\.ts$/, '.m3u8');
                    media.contentType = 'application/x-mpegurl';
                }
                media.streamType = cast.framework.messages.StreamType.LIVE;
            }

            const metadata = media?.metadata;
            const title = metadata?.title || 'EasyChannel IPTV';
            const logo = metadata?.images?.[0]?.url;
            const customData = loadRequestData.customData || media?.customData;
            if (customData && customData.preferredAudio) {
                preferredLanguage = customData.preferredAudio;
            } else {
                preferredLanguage = '';
            }

            window.__ecFixTried = false;
            window.__ecFixApplied = false;
            diagnosticTimers.forEach(clearTimeout);
            // Samples 5-15s are pre-fix while playing; the host-size experiment runs at 17s.
            diagnosticTimers = [5000, 10000, 15000, 20000, 25000, 30000, 45000, 60000].map(ms => setTimeout(sendDiagnostics, ms));
            diagnosticTimers.push(setTimeout(applyHostSizeExperiment, 17000));
            showOverlay(title, 'Laddar ström...', logo, 8000);
            return loadRequestData;
        });

        // Intercept EDIT_TRACKS_INFO to allow sender to switch audio tracks via standard Cast API
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.EDIT_TRACKS_INFO, request => {
            console.log('[EasyChannel IPTV Receiver] EDIT_TRACKS_INFO received:', request);
            if (request.activeTrackIds && request.activeTrackIds.length > 0) {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const mediaInfo = playerManager.getMediaInformation();
                const mediaTracks = mediaInfo?.tracks || [];

                for (const wantedId of request.activeTrackIds) {
                    const mTrack = mediaTracks.find(mt => mt.trackId === wantedId);
                    let audioMatch = null;
                    if (mTrack && mTrack.type === cast.framework.messages.TrackType.AUDIO) {
                        audioMatch = tracks.find(t => matchLang(t.language, mTrack.language) && t.name === mTrack.name)
                                  || tracks.find(t => matchLang(t.language, mTrack.language));
                    }
                    if (!audioMatch) {
                        audioMatch = tracks.find(t => t.trackId === wantedId);
                    }
                    if (audioMatch) {
                        console.log('[EasyChannel IPTV Receiver] Setting active audio track to ID:', audioMatch.trackId, audioMatch.language);
                        audioManager.setActiveById(audioMatch.trackId);
                        showOverlay(document.getElementById('channel-title').textContent, 'Ljud: ' + (audioMatch.name || audioMatch.language || audioMatch.trackId), null, 4000);
                        broadcastTrackList();
                        request.activeTrackIds = [audioMatch.trackId];
                        break;
                    }
                }
            }
            return request;
        });

        // Event: When media load completes and tracks are available
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            console.log('[EasyChannel IPTV Receiver] PLAYER_LOAD_COMPLETE');
            const audioManager = playerManager.getAudioTracksManager();
            const tracks = audioManager.getTracks() || [];
            console.log('[EasyChannel IPTV Receiver] Found audio tracks:', tracks);

            if (preferredLanguage) {
                const normTarget = normalizeLang(preferredLanguage);
                let matchedTrack = tracks.find(t => matchLang(t.language, preferredLanguage));
                if (!matchedTrack) {
                    matchedTrack = tracks.find(t => {
                        const name = (t.name || '').toLowerCase();
                        return name.includes(preferredLanguage.toLowerCase()) || (normTarget && name.includes(normTarget));
                    });
                }
                if (matchedTrack) {
                    console.log('[EasyChannel IPTV Receiver] Selecting initial audio track by ID:', matchedTrack.trackId, matchedTrack.language);
                    audioManager.setActiveById(matchedTrack.trackId);
                } else {
                    try {
                        audioManager.setActiveByLanguage(preferredLanguage);
                    } catch (err) {
                        console.warn('[EasyChannel IPTV Receiver] Preferred audio language unavailable:', preferredLanguage, err);
                    }
                }
            }

            const currentActive = audioManager.getActiveTrack();
            const langLabel = currentActive ? (currentActive.name || currentActive.language || 'Standard') : 'Standard';
            showOverlay(document.getElementById('channel-title').textContent, 'Spelar • ' + langLabel, null, 5000);

            // Send full track list back to Android sender app
            setTimeout(broadcastTrackList, 500);
        });

        // Custom Message Channel for direct sender commands
        function handleCustomMessage(event) {
            const data = event.data;
            console.log('[EasyChannel IPTV Receiver] Custom message received:', data);

            if (data.type === 'SELECT_TRACK' || data.type === 'SELECT_TRACK_ID') {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                let match = null;

                // Priority 1: Match by exact trackId
                if (data.trackId !== undefined && data.trackId !== null) {
                    match = tracks.find(t => t.trackId === Number(data.trackId));
                }

                // Priority 2: Match by language (+ name if available)
                if (!match && data.language) {
                    match = tracks.find(t => matchLang(t.language, data.language) && (!data.name || t.name === data.name))
                         || tracks.find(t => matchLang(t.language, data.language));
                }

                if (match) {
                    console.log('[EasyChannel IPTV Receiver] Setting active audio track to ID:', match.trackId, match.language, match.name);
                    audioManager.setActiveById(match.trackId);
                    showOverlay(document.getElementById('channel-title').textContent, 'Ljud: ' + (match.name || match.language || match.trackId), null, 4000);
                    broadcastTrackList();
                }
            } else if (data.type === 'SELECT_LANGUAGE') {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const match = tracks.find(t => matchLang(t.language, data.language));
                if (match) {
                    audioManager.setActiveById(match.trackId);
                } else {
                    try {
                        audioManager.setActiveByLanguage(data.language);
                    } catch (err) {
                        console.warn('[EasyChannel IPTV Receiver] Language unavailable:', data.language, err);
                    }
                }
                broadcastTrackList();
            } else if (data.type === 'QUERY_TRACKS') {
                broadcastTrackList();
            }
        }

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
            console.error('[EasyChannel IPTV Receiver] PLAYBACK ERROR', {
                detailedErrorCode: event.detailedErrorCode,
                reason: event.reason,
                severity: event.severity,
                error: event.error,
                triggeredByEventType: event.triggeredByEventType
            });
            const errDetail = event.detailedErrorCode || event.reason || 'okänt';
            showOverlay(document.getElementById('channel-title').textContent || 'EasyChannel IPTV', 'Fel: ' + errDetail, null, 0);
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'RECEIVER_ERROR',
                    detailedErrorCode: event.detailedErrorCode,
                    reason: event.reason,
                    severity: event.severity
                });
            } catch (_) {}
        });

        window.addEventListener('error', (e) => {
            console.error('[EasyChannel IPTV Receiver] Window error:', e);
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'WINDOW_ERROR',
                    message: e.message
                });
            } catch (_) {}
        });

        context.addCustomMessageListener(CUSTOM_CHANNEL, handleCustomMessage);
        context.addCustomMessageListener(LEGACY_CHANNEL, handleCustomMessage);

        // Playback configuration for IPTV HLS / TS live streams
        const playbackConfig = new cast.framework.PlaybackConfig();
        playbackConfig.autoResumeDuration = 5;
        playbackConfig.shakaConfig = {
            streaming: {
                bufferingGoal: 4,
                rebufferingGoal: 2,
                bufferBehind: 15,
                inaccurateManifestTolerance: 2
            },
            manifest: {
                hls: {
                    ignoreTextStreamFailures: true
                }
            }
        };

        // Bounded diagnostics on explicit request; no media URLs or credentials.
        function rectOf(el) {
            if (!el) return null;
            const r = el.getBoundingClientRect();
            return [Math.round(r.left), Math.round(r.top), Math.round(r.width), Math.round(r.height)];
        }

        // One-shot experiment: give the host element a real layout box.
        function applyHostSizeExperiment() {
            if (window.__ecFixTried) return;
            window.__ecFixTried = true;
            const host = document.getElementById('media-player');
            if (!host) return;
            host.style.display = 'block';
            host.style.position = 'fixed';
            host.style.top = '0';
            host.style.left = '0';
            host.style.width = '100%';
            host.style.height = '100%';
            window.__ecFixApplied = true;
        }

        function sendDiagnostics() {
            try {
                const stats = playerManager.getStats();
                const host = document.getElementById('media-player');
                const sr = host?.shadowRoot;
                const video = sr?.querySelector('video') || document.querySelector('video');
                const playerEl = sr?.getElementById('castPlayer');
                const fg = sr?.querySelector('.foreground');
                const compStyle = video ? window.getComputedStyle(video) : null;
                const hostStyle = host ? window.getComputedStyle(host) : null;
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'PLAYBACK_DIAGNOSTICS',
                    version: 'diag-3-layout',
                    state: playerManager.getPlayerState(),
                    time: playerManager.getCurrentTimeSec(),
                    statsW: stats.width, statsH: stats.height,
                    decodedFrames: stats.decodedFrames, droppedFrames: stats.droppedFrames,
                    videoWidth: video?.videoWidth, videoHeight: video?.videoHeight,
                    readyState: video?.readyState, error: video?.error?.code,
                    display: compStyle?.display, visibility: compStyle?.visibility, opacity: compStyle?.opacity,
                    viewport: [window.innerWidth, window.innerHeight, window.devicePixelRatio],
                    bodyRect: rectOf(document.body),
                    hostRect: rectOf(host),
                    hostDisplay: hostStyle?.display, hostPosition: hostStyle?.position,
                    hostCssW: hostStyle?.width, hostCssH: hostStyle?.height, hostOverflow: hostStyle?.overflow,
                    playerRect: rectOf(playerEl),
                    playerState: playerEl?.getAttribute('data-state'),
                    playerCategory: playerEl?.getAttribute('data-media-category'),
                    foregroundRect: rectOf(fg),
                    videoRect: rectOf(video),
                    shadow: !!sr,
                    fixApplied: window.__ecFixApplied === true
                });
            } catch (error) { console.warn('Diagnostics unavailable', error); }
        }
        context.addCustomMessageListener(CUSTOM_CHANNEL, event => {
            if (event.data?.type === 'QUERY_DIAGNOSTICS') sendDiagnostics();
        });

        context.start({
            useShakaForHls: true,
            versionCode: 2026092002,
            playbackConfig: playbackConfig,
            customNamespaces: {
                [CUSTOM_CHANNEL]: cast.framework.system.MessageType.JSON,
                [LEGACY_CHANNEL]: cast.framework.system.MessageType.JSON
            }
        });
        console.log('[EasyChannel IPTV Receiver] Cast Receiver Context started');
    </script>
</body>
</html>
