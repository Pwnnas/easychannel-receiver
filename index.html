<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>EasyChannel IPTV Cast Receiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #041E3E;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        cast-media-player {
            --theme-hue: 45; /* Golden Accent */
            --splash-image: none;
            --watermark-image: none;
        }

        #channel-overlay {
            position: absolute;
            top: 48px;
            left: 48px;
            display: flex;
            align-items: center;
            /* NOTE: backdrop-filter breaks the Chromecast hardware video overlay
               (the video surface collapses to 1x1 px and the picture goes black),
               so we use a near-opaque background instead of a frosted-glass blur. */
            background: rgba(13, 32, 55, 0.96);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        #channel-overlay.visible {
            opacity: 1;
        }

        #channel-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-right: 16px;
            border-radius: 8px;
            display: none;
        }

        #channel-title {
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
        }

        #channel-status {
            color: #FFD166;
            font-size: 18px;
            font-weight: 500;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="channel-overlay">
        <img id="channel-logo" alt="">
        <div>
            <div id="channel-title">EasyChannel IPTV</div>
            <div id="channel-status">Ansluten</div>
        </div>
    </div>

    <cast-media-player id="media-player"></cast-media-player>

    <script>
        const CUSTOM_CHANNEL = 'urn:x-cast:com.easychannel.iptv';
        const LEGACY_CHANNEL = 'urn:x-cast:com.senioriptv';
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();

        // Overlay text follows the sender's app language (sent in customData.language).
        const OVERLAY_TEXT = {
            sv: { connected: 'Ansluten', loading: 'Laddar ström...', playing: 'Spelar', audio: 'Ljud', text: 'Text', off: 'Av', error: 'Fel' },
            en: { connected: 'Connected', loading: 'Loading stream...', playing: 'Playing', audio: 'Audio', text: 'Subtitles', off: 'Off', error: 'Error' }
        };
        let currentLanguage = 'sv';
        function tr(key) {
            const table = OVERLAY_TEXT[currentLanguage] || OVERLAY_TEXT.sv;
            return table[key] || OVERLAY_TEXT.sv[key] || key;
        }

        let hideOverlayTimer = null;
        function showOverlay(title, status, logoUrl, durationMs = 6000) {
            const overlay = document.getElementById('channel-overlay');
            const titleEl = document.getElementById('channel-title');
            const statusEl = document.getElementById('channel-status');
            const logoEl = document.getElementById('channel-logo');

            titleEl.textContent = title || 'EasyChannel IPTV';
            statusEl.textContent = status || '';

            if (logoUrl) {
                logoEl.src = logoUrl;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }

            overlay.classList.add('visible');
            if (hideOverlayTimer) clearTimeout(hideOverlayTimer);
            if (durationMs > 0) {
                hideOverlayTimer = setTimeout(() => overlay.classList.remove('visible'), durationMs);
            }
        }

        let lastTrackSignature = '';
        function broadcastTrackList(force = false) {
            try {
                const audioManager = playerManager.getAudioTracksManager();
                const textManager = playerManager.getTextTracksManager();
                const audioTracks = audioManager.getTracks() || [];
                const textTracks = textManager.getTracks() || [];
                const activeAudio = audioManager.getActiveTrack();
                const activeTextIds = new Set((textManager.getActiveTracks() || []).map(t => t.trackId));

                const payload = {
                    type: 'TRACKS_UPDATE',
                    tracks: [...audioTracks.map(t => ({
                        id: t.trackId,
                        language: t.language || '',
                        name: t.name || t.language || `Spår ${t.trackId}`,
                        type: 'AUDIO',
                        isSelected: activeAudio ? (t.trackId === activeAudio.trackId) : false
                    })), ...textTracks.map(t => ({
                        id: t.trackId,
                        language: t.language || '',
                        name: t.name || t.language || `Text ${t.trackId}`,
                        type: 'TEXT',
                        isSelected: activeTextIds.has(t.trackId)
                    }))]
                };

                const signature = JSON.stringify(payload.tracks);
                if (!force && signature === lastTrackSignature) return;
                lastTrackSignature = signature;
                console.log('[EasyChannel IPTV Receiver] Broadcasting tracks:', payload);
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, payload);
                context.sendCustomMessage(LEGACY_CHANNEL, undefined, payload);
            } catch (err) {
                console.warn('[EasyChannel IPTV Receiver] Could not broadcast tracks:', err);
            }
        }

        function normalizeLang(code) {
            if (!code) return '';
            const clean = String(code).trim().toLowerCase().replace('_', '-');
            const synonyms = {
                'sv': 'swe', 'swe': 'swe',
                'no': 'nor', 'nor': 'nor', 'nob': 'nor', 'nno': 'nor',
                'da': 'dan', 'dan': 'dan',
                'fi': 'fin', 'fin': 'fin',
                'en': 'eng', 'eng': 'eng',
                'de': 'deu', 'ger': 'deu', 'deu': 'deu',
                'fr': 'fra', 'fre': 'fra', 'fra': 'fra',
                'es': 'spa', 'spa': 'spa',
                'it': 'ita', 'ita': 'ita',
                'nl': 'nld', 'dut': 'nld', 'nld': 'nld',
                'pl': 'pol', 'pol': 'pol',
                'ru': 'rus', 'rus': 'rus'
            };
            if (synonyms[clean]) return synonyms[clean];
            const prefix2 = clean.substring(0, 2);
            if (synonyms[prefix2]) return synonyms[prefix2];
            return clean;
        }

        function matchLang(code1, code2) {
            if (!code1 && !code2) return true;
            if (!code1 || !code2) return false;
            const c1 = String(code1).trim().toLowerCase();
            const c2 = String(code2).trim().toLowerCase();
            if (c1 === c2) return true;
            const n1 = normalizeLang(c1);
            const n2 = normalizeLang(c2);
            if (n1 && n1 === n2) return true;
            if ((c1.length >= 2 && c2.length >= 2) && (c1.startsWith(c2 + '-') || c2.startsWith(c1 + '-'))) return true;
            return false;
        }

        let preferredLanguage = '';
        let preferredAudioName = '';
        let audioPreferenceApplied = false;
        let preferredSubtitle = '';
        let preferredSubtitleName = '';
        let currentIsVod = false;
        // undefined = not resolved yet, [] = subtitles off, [id] = the single selected track.
        let vodDesiredTextIds = undefined;
        let vodTextAppliedAt = 0;
        function applyVodAudioPreference() {
            if (!currentIsVod || audioPreferenceApplied || !preferredLanguage) return;
            try {
                const manager = playerManager.getAudioTracksManager();
                const tracks = manager.getTracks() || [];
                const match = tracks.find(t => matchLang(t.language, preferredLanguage) &&
                    (!preferredAudioName || t.name === preferredAudioName))
                    || tracks.find(t => matchLang(t.language, preferredLanguage))
                    || (preferredAudioName && tracks.find(t => t.name === preferredAudioName));
                if (match) {
                    manager.setActiveById(match.trackId);
                    audioPreferenceApplied = true;
                }
            } catch (error) {
                console.warn('[EasyChannel IPTV Receiver] Audio preference pending:', error);
            }
        }
        // Resolve the sender's saved subtitle choice against the tracks CAF has published.
        // Returns undefined while the track list is still empty so the caller can wait.
        function resolveVodTextIds() {
            const manager = playerManager.getTextTracksManager();
            const tracks = manager.getTracks() || [];
            if (preferredSubtitle === 'off' || (!preferredSubtitle && !preferredSubtitleName)) return [];
            const match = tracks.find(t => matchLang(t.language, preferredSubtitle) &&
                (!preferredSubtitleName || t.name === preferredSubtitleName))
                || tracks.find(t => matchLang(t.language, preferredSubtitle))
                || (preferredSubtitleName && tracks.find(t => t.name === preferredSubtitleName));
            return match ? [match.trackId] : undefined;
        }
        // Keep exactly one VOD subtitle track active. Cast can drop or duplicate the text track
        // after a seek or pause, so the user's choice is re-asserted instead of trusting CAF.
        function enforceVodTextSelection(force = false) {
            if (!currentIsVod) return;
            try {
                const manager = playerManager.getTextTracksManager();
                if (vodDesiredTextIds === undefined) {
                    const resolved = resolveVodTextIds();
                    if (resolved === undefined) return;
                    vodDesiredTextIds = resolved;
                }
                const active = (manager.getActiveTracks() || []).map(t => t.trackId);
                const desired = vodDesiredTextIds;
                const same = active.length === desired.length && desired.every(id => active.includes(id));
                // Re-assert a dropped/duplicated selection, but throttle repeats so a lagging
                // active-track report cannot reload the subtitle stream every tick.
                if (force || (!same && Date.now() - vodTextAppliedAt > 4000)) {
                    manager.setActiveByIds(desired);
                    vodTextAppliedAt = Date.now();
                }
            } catch (error) {
                console.warn('[EasyChannel IPTV Receiver] Subtitle preference pending:', error);
            }
        }
        // Overlay line that names the audio and subtitle currently playing on the TV.
        function currentTrackSummary() {
            try {
                const audio = playerManager.getAudioTracksManager().getActiveTrack();
                const audioLabel = audio ? (audio.name || audio.language || 'Standard') : 'Standard';
                const text = (playerManager.getTextTracksManager().getActiveTracks() || [])[0];
                const textLabel = text ? (text.name || text.language || tr('text')) : tr('off');
                return tr('audio') + ': ' + audioLabel + ' · ' + tr('text') + ': ' + textLabel;
            } catch (error) {
                return '';
            }
        }

        // Intercept LOAD request to read metadata and preferred audio
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, loadRequestData => {
            console.log('[EasyChannel IPTV Receiver] LOAD RECEIVED', loadRequestData.media?.contentType);
            const media = loadRequestData.media;
            const customData = loadRequestData.customData || media?.customData;
            const isVod = customData?.vod === true;
            currentIsVod = isVod;
            lastTrackSignature = '';
            audioPreferenceApplied = false;
            vodDesiredTextIds = undefined;
            vodTextAppliedAt = 0;
            if (media) {
                if (!isVod && media.contentUrl && media.contentUrl.endsWith('.ts')) {
                    media.contentUrl = media.contentUrl.replace(/\.ts$/, '.m3u8');
                    media.contentType = 'application/x-mpegurl';
                }
                if (!isVod && media.contentId && media.contentId.endsWith('.ts')) {
                    media.contentId = media.contentId.replace(/\.ts$/, '.m3u8');
                    media.contentType = 'application/x-mpegurl';
                }
                media.streamType = isVod ? cast.framework.messages.StreamType.BUFFERED
                    : cast.framework.messages.StreamType.LIVE;
            }

            const metadata = media?.metadata;
            const title = metadata?.title || 'EasyChannel IPTV';
            const logo = metadata?.images?.[0]?.url;
            if (customData && customData.preferredAudio) {
                preferredLanguage = customData.preferredAudio;
            } else {
                preferredLanguage = '';
            }
            preferredAudioName = customData?.preferredAudioName || '';
            preferredSubtitle = customData?.preferredSubtitle || '';
            preferredSubtitleName = customData?.preferredSubtitleName || '';
            currentLanguage = customData?.language === 'en' ? 'en' : 'sv';

            showOverlay(title, tr('loading'), logo, 8000);
            return loadRequestData;
        });

        // Intercept EDIT_TRACKS_INFO to allow sender to switch audio tracks via standard Cast API
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.EDIT_TRACKS_INFO, request => {
            console.log('[EasyChannel IPTV Receiver] EDIT_TRACKS_INFO received:', request);
            // The sender switches VOD subtitles through the standard Cast API, so remember the
            // requested text tracks here and keep enforcing exactly that selection afterwards.
            if (currentIsVod && Array.isArray(request.activeTrackIds)) {
                const knownTracks = playerManager.getMediaInformation()?.tracks || [];
                vodDesiredTextIds = request.activeTrackIds.filter(id =>
                    knownTracks.some(mt => mt.trackId === id && mt.type === cast.framework.messages.TrackType.TEXT));
            }
            if (request.activeTrackIds && request.activeTrackIds.length > 0) {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const mediaInfo = playerManager.getMediaInformation();
                const mediaTracks = mediaInfo?.tracks || [];

                for (const wantedId of request.activeTrackIds) {
                    const mTrack = mediaTracks.find(mt => mt.trackId === wantedId);
                    let audioMatch = null;
                    if (mTrack && mTrack.type === cast.framework.messages.TrackType.AUDIO) {
                        audioMatch = tracks.find(t => matchLang(t.language, mTrack.language) && t.name === mTrack.name)
                                  || tracks.find(t => matchLang(t.language, mTrack.language));
                    }
                    if (!audioMatch) {
                        audioMatch = tracks.find(t => t.trackId === wantedId);
                    }
                    if (audioMatch) {
                        console.log('[EasyChannel IPTV Receiver] Setting active audio track to ID:', audioMatch.trackId, audioMatch.language);
                        audioManager.setActiveById(audioMatch.trackId);
                        showOverlay(document.getElementById('channel-title').textContent,
                            currentIsVod ? currentTrackSummary() : (tr('audio') + ': ' + (audioMatch.name || audioMatch.language || audioMatch.trackId)), null, 4000);
                        broadcastTrackList();
                        const textIds = currentIsVod ? request.activeTrackIds.filter(id =>
                            mediaTracks.some(mt => mt.trackId === id && mt.type === cast.framework.messages.TrackType.TEXT)) : [];
                        request.activeTrackIds = [audioMatch.trackId, ...textIds];
                        break;
                    }
                }
            }
            return request;
        });

        // Event: When media load completes and tracks are available
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            console.log('[EasyChannel IPTV Receiver] PLAYER_LOAD_COMPLETE');
            const audioManager = playerManager.getAudioTracksManager();
            const tracks = audioManager.getTracks() || [];
            console.log('[EasyChannel IPTV Receiver] Found audio tracks:', tracks);

            if (currentIsVod) {
                applyVodAudioPreference();
            } else if (preferredLanguage) {
                const normTarget = normalizeLang(preferredLanguage);
                let matchedTrack = tracks.find(t => matchLang(t.language, preferredLanguage) &&
                    (!preferredAudioName || t.name === preferredAudioName))
                    || tracks.find(t => matchLang(t.language, preferredLanguage));
                if (!matchedTrack) {
                    matchedTrack = tracks.find(t => {
                        const name = (t.name || '').toLowerCase();
                        return name.includes(preferredLanguage.toLowerCase()) || (normTarget && name.includes(normTarget));
                    });
                }
                if (matchedTrack) {
                    console.log('[EasyChannel IPTV Receiver] Selecting initial audio track by ID:', matchedTrack.trackId, matchedTrack.language);
                    audioManager.setActiveById(matchedTrack.trackId);
                } else {
                    try {
                        audioManager.setActiveByLanguage(preferredLanguage);
                    } catch (err) {
                        console.warn('[EasyChannel IPTV Receiver] Preferred audio language unavailable:', preferredLanguage, err);
                    }
                }
            }

            const currentActive = audioManager.getActiveTrack();
            const langLabel = currentActive ? (currentActive.name || currentActive.language || 'Standard') : 'Standard';
            showOverlay(document.getElementById('channel-title').textContent,
                tr('playing') + ' • ' + (currentIsVod ? currentTrackSummary() : langLabel), null, 5000);

            // Send full track list back to Android sender app
            setTimeout(() => { enforceVodTextSelection(true); broadcastTrackList(true); }, 500);
        });

        // Custom Message Channel for direct sender commands
        function handleCustomMessage(event) {
            const data = event.data;
            console.log('[EasyChannel IPTV Receiver] Custom message received:', data);

            if (data.type === 'SELECT_TEXT_TRACK') {
                const manager = playerManager.getTextTracksManager();
                vodDesiredTextIds = data.trackId == null ? [] : [Number(data.trackId)];
                manager.setActiveByIds(vodDesiredTextIds);
                broadcastTrackList(true);
                showOverlay(document.getElementById('channel-title').textContent, currentTrackSummary(), null, 4000);
            } else if (data.type === 'SELECT_AUDIO_TRACK') {
                const manager = playerManager.getAudioTracksManager();
                manager.setActiveById(Number(data.trackId));
                audioPreferenceApplied = true;
                broadcastTrackList(true);
                showOverlay(document.getElementById('channel-title').textContent, currentTrackSummary(), null, 4000);
            } else if (data.type === 'SELECT_TRACK' || data.type === 'SELECT_TRACK_ID') {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                let match = null;

                // Priority 1: Match by exact trackId
                if (data.trackId !== undefined && data.trackId !== null) {
                    match = tracks.find(t => t.trackId === Number(data.trackId));
                }

                // Priority 2: Match by language (+ name if available)
                if (!match && data.language) {
                    match = tracks.find(t => matchLang(t.language, data.language) && (!data.name || t.name === data.name))
                         || tracks.find(t => matchLang(t.language, data.language));
                }

                if (match) {
                    console.log('[EasyChannel IPTV Receiver] Setting active audio track to ID:', match.trackId, match.language, match.name);
                    audioManager.setActiveById(match.trackId);
                    showOverlay(document.getElementById('channel-title').textContent, tr('audio') + ': ' + (match.name || match.language || match.trackId), null, 4000);
                    broadcastTrackList();
                }
            } else if (data.type === 'SELECT_LANGUAGE') {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const match = tracks.find(t => matchLang(t.language, data.language));
                if (match) {
                    audioManager.setActiveById(match.trackId);
                } else {
                    try {
                        audioManager.setActiveByLanguage(data.language);
                    } catch (err) {
                        console.warn('[EasyChannel IPTV Receiver] Language unavailable:', data.language, err);
                    }
                }
                broadcastTrackList();
            } else if (data.type === 'QUERY_TRACKS') {
                broadcastTrackList(true);
            }
        }

        // Some VOD containers publish tracks after the initial load callback. Re-assert the
        // chosen audio/subtitle tracks so a seek or pause cannot silently drop or duplicate them.
        setInterval(() => {
            if (currentIsVod) { applyVodAudioPreference(); enforceVodTextSelection(); broadcastTrackList(); }
        }, 1000);

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
            console.error('[EasyChannel IPTV Receiver] PLAYBACK ERROR', {
                detailedErrorCode: event.detailedErrorCode,
                reason: event.reason,
                severity: event.severity,
                error: event.error,
                triggeredByEventType: event.triggeredByEventType
            });
            const errDetail = event.detailedErrorCode || event.reason || 'okänt';
            showOverlay(document.getElementById('channel-title').textContent || 'EasyChannel IPTV', tr('error') + ': ' + errDetail, null, 0);
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'RECEIVER_ERROR',
                    detailedErrorCode: event.detailedErrorCode,
                    reason: event.reason,
                    severity: event.severity
                });
            } catch (_) {}
        });

        window.addEventListener('error', (e) => {
            console.error('[EasyChannel IPTV Receiver] Window error:', e);
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'WINDOW_ERROR',
                    message: e.message
                });
            } catch (_) {}
        });

        context.addCustomMessageListener(CUSTOM_CHANNEL, handleCustomMessage);
        context.addCustomMessageListener(LEGACY_CHANNEL, handleCustomMessage);

        document.getElementById('channel-status').textContent = tr('connected');

        // Playback configuration for IPTV HLS / TS live streams.
        // NOTE: do NOT enable useShakaForHls. Shaka's HLS parser cannot switch
        // muxed multi-audio tracks (Swedish/English/Finnish etc.), so the TV
        // would always play the default audio. The native Cast HLS player
        // handles the proxy's single-variant muxed TS correctly.
        const playbackConfig = new cast.framework.PlaybackConfig();
        playbackConfig.autoResumeDuration = 5;


        context.start({
            versionCode: 2026092406,
            playbackConfig: playbackConfig,
            customNamespaces: {
                [CUSTOM_CHANNEL]: cast.framework.system.MessageType.JSON,
                [LEGACY_CHANNEL]: cast.framework.system.MessageType.JSON
            }
        });
        console.log('[EasyChannel IPTV Receiver] Cast Receiver Context started');
    </script>
</body>
</html>
