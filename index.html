<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>BisectD</title>
<script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
<style>
    #channel-overlay {
        position: absolute;
        top: 48px;
        left: 48px;
        display: flex;
        align-items: center;
        background: rgba(16, 40, 69, 0.85);
        padding: 16px 24px;
        border-radius: 16px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.15);
        z-index: 100;
        opacity: 0;
        transition: opacity 0.5s ease-in-out;
        pointer-events: none;
    }
</style>
</head>
<body>
<div id="channel-overlay">
    <div id="channel-title">EasyChannel IPTV</div>
    <div id="channel-status">Ansluten</div>
</div>
<cast-media-player id="player"></cast-media-player>
<script>
const NS = 'urn:x-cast:com.easychannel.iptv';
const context = cast.framework.CastReceiverContext.getInstance();
const playerManager = context.getPlayerManager();
context.addCustomMessageListener(NS, (e) => {
    if (e.data && e.data.type === 'QUERY_DIAGNOSTICS') {
        const s = playerManager.getStats();
        const video = document.querySelector('cast-media-player').shadowRoot.querySelector('video');
        context.sendCustomMessage(NS, undefined, {
            type: 'PLAYBACK_DIAGNOSTICS', version: 'bisectD',
            state: playerManager.getPlayerState(),
            videoWidth: video && video.videoWidth, decodedFrames: s.decodedFrames
        });
    }
});
context.start({ customNamespaces: { [NS]: cast.framework.system.MessageType.JSON } });
</script>
</body>
</html>
