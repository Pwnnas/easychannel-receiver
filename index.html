<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="utf-8">
    <title>EasyChannel IPTV Cast Receiver</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
        }

        body {
            background-color: #041E3E;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        cast-media-player {
            --theme-hue: 45; /* Golden Accent */
            --splash-image: none;
            --watermark-image: none;
        }

        #channel-overlay {
            position: absolute;
            top: 48px;
            /* Centred with margins, not a transform: effects on the layer above the video have
               blanked the Chromecast picture before (see backdrop-filter below). */
            left: 0;
            right: 0;
            margin: 0 auto;
            width: max-content;
            max-width: 70vw;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            /* NOTE: backdrop-filter breaks the Chromecast hardware video overlay
               (the video surface collapses to 1x1 px and the picture goes black),
               so we use a near-opaque background instead of a frosted-glass blur. */
            background: rgba(13, 32, 55, 0.96);
            padding: 16px 24px;
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
            z-index: 100;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        #channel-overlay.visible {
            opacity: 1;
        }

        /* Older Chromecast: no blurred shadow or fade to recomposite over the video. */
        body.lite #channel-overlay {
            background: rgb(13, 32, 55);
            box-shadow: none;
            transition: none;
        }

        #channel-overlay > div {
            min-width: 0;
        }

        #channel-logo {
            width: 56px;
            height: 56px;
            object-fit: contain;
            margin-right: 16px;
            border-radius: 8px;
            display: none;
        }

        #channel-title {
            color: #FFFFFF;
            font-size: 28px;
            font-weight: 700;
            line-height: 1.2;
            /* Provider titles can repeat the series name; two lines at most. */
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        #channel-status {
            color: #FFD166;
            font-size: 18px;
            font-weight: 500;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="channel-overlay">
        <img id="channel-logo" alt="">
        <div>
            <div id="channel-title">EasyChannel IPTV</div>
            <div id="channel-status">Ansluten</div>
        </div>
    </div>

    <cast-media-player id="media-player"></cast-media-player>

    <script>
        const CUSTOM_CHANNEL = 'urn:x-cast:com.easychannel.iptv';
        const LEGACY_CHANNEL = 'urn:x-cast:com.senioriptv';
        const context = cast.framework.CastReceiverContext.getInstance();
        const playerManager = context.getPlayerManager();
        // Sent in CAPABILITIES so the sender's log shows which receiver a (possibly cached) TV runs.
        const RECEIVER_VERSION = 2026103001;
        // An older Chromecast (gen 1-3: no HEVC, 512 MB, weak GPU) gets a lighter overlay and a
        // smaller VOD buffer. It is decided here, before context.start, where the buffer has to be set.
        // canDisplayType did not say no here on a gen 3 that answered hevc:false right after start
        // (2026-10-30: logo shown, large buffer), so Media Source is asked. Android TV and Google TV
        // have HEVC and "Android" in their user agent, so they are never taken for an older Chromecast.
        const LITE_AT_START = !/Android/.test(navigator.userAgent) && hevcByMediaSource() === false;
        let LITE_DEVICE = LITE_AT_START;
        if (LITE_DEVICE) document.body.classList.add('lite');
        function hevcByMediaSource() {
            try {
                return typeof MediaSource !== 'undefined'
                    ? MediaSource.isTypeSupported('video/mp4; codecs="hev1.1.6.L93.B0"') : undefined;
            } catch (_) { return undefined; }
        }

        // Overlay text follows the sender's app language (sent in customData.language).
        const OVERLAY_TEXT = {
            sv: { connected: 'Ansluten', loading: 'Laddar ström...', playing: 'Spelar', audio: 'Ljud', text: 'Text', off: 'Av', error: 'Fel', unknown: 'okänt', track: 'Spår', unsupportedCodec: 'Den här Chromecasten kan inte spela den här videon' },
            en: { connected: 'Connected', loading: 'Loading stream...', playing: 'Playing', audio: 'Audio', text: 'Subtitles', off: 'Off', error: 'Error', unknown: 'unknown', track: 'Track', unsupportedCodec: "This Chromecast doesn't support this video" }
        };
        // English unless the app asks for Swedish: an older app or an unknown language gets English.
        let currentLanguage = 'en';
        function tr(key) {
            const table = OVERLAY_TEXT[currentLanguage] || OVERLAY_TEXT.en;
            return table[key] || OVERLAY_TEXT.en[key] || key;
        }

        let hideOverlayTimer = null;
        // An error overlay stays up until playback resumes: a live stream often recovers by itself.
        let errorOverlayShown = false;
        function showOverlay(title, status, logoUrl, durationMs = 6000) {
            errorOverlayShown = false;
            const overlay = document.getElementById('channel-overlay');
            const titleEl = document.getElementById('channel-title');
            const statusEl = document.getElementById('channel-status');
            const logoEl = document.getElementById('channel-logo');

            titleEl.textContent = title || 'EasyChannel IPTV';
            statusEl.textContent = status || '';

            // A provider image is decoded at full size however small it is shown.
            if (logoUrl && !LITE_DEVICE) {
                logoEl.src = logoUrl;
                logoEl.style.display = 'block';
            } else {
                logoEl.style.display = 'none';
            }

            overlay.classList.add('visible');
            if (hideOverlayTimer) clearTimeout(hideOverlayTimer);
            if (durationMs > 0) {
                hideOverlayTimer = setTimeout(() => overlay.classList.remove('visible'), durationMs);
            }
        }

        let lastTrackSignature = '';
        function broadcastTrackList(force = false) {
            try {
                const audioManager = playerManager.getAudioTracksManager();
                const textManager = playerManager.getTextTracksManager();
                const audioTracks = audioManager.getTracks() || [];
                const textTracks = textManager.getTracks() || [];
                const activeAudio = audioManager.getActiveTrack();
                const activeTextIds = new Set((textManager.getActiveTracks() || []).map(t => t.trackId));

                const payload = {
                    type: 'TRACKS_UPDATE',
                    tracks: [...audioTracks.map(t => ({
                        id: t.trackId,
                        language: t.language || '',
                        name: t.name || t.language || tr('track') + ' ' + t.trackId,
                        type: 'AUDIO',
                        isSelected: activeAudio ? (t.trackId === activeAudio.trackId) : false
                    })), ...textTracks.map(t => ({
                        id: t.trackId,
                        language: t.language || '',
                        name: t.name || t.language || `Text ${t.trackId}`,
                        type: 'TEXT',
                        isSelected: activeTextIds.has(t.trackId)
                    }))]
                };

                const signature = JSON.stringify(payload.tracks);
                if (!force && signature === lastTrackSignature) return;
                lastTrackSignature = signature;
                console.log('[EasyChannel IPTV Receiver] Broadcasting tracks:', payload);
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, payload);
                context.sendCustomMessage(LEGACY_CHANNEL, undefined, payload);
            } catch (err) {
                console.warn('[EasyChannel IPTV Receiver] Could not broadcast tracks:', err);
            }
        }

        function normalizeLang(code) {
            if (!code) return '';
            const clean = String(code).trim().toLowerCase().replace('_', '-');
            const synonyms = {
                'sv': 'swe', 'swe': 'swe',
                'no': 'nor', 'nor': 'nor', 'nob': 'nor', 'nno': 'nor',
                'da': 'dan', 'dan': 'dan',
                'fi': 'fin', 'fin': 'fin',
                'en': 'eng', 'eng': 'eng',
                'de': 'deu', 'ger': 'deu', 'deu': 'deu',
                'fr': 'fra', 'fre': 'fra', 'fra': 'fra',
                'es': 'spa', 'spa': 'spa',
                'it': 'ita', 'ita': 'ita',
                'nl': 'nld', 'dut': 'nld', 'nld': 'nld',
                'pl': 'pol', 'pol': 'pol',
                'ru': 'rus', 'rus': 'rus'
            };
            if (synonyms[clean]) return synonyms[clean];
            const prefix2 = clean.substring(0, 2);
            if (synonyms[prefix2]) return synonyms[prefix2];
            return clean;
        }

        function matchLang(code1, code2) {
            if (!code1 && !code2) return true;
            if (!code1 || !code2) return false;
            const c1 = String(code1).trim().toLowerCase();
            const c2 = String(code2).trim().toLowerCase();
            if (c1 === c2) return true;
            const n1 = normalizeLang(c1);
            const n2 = normalizeLang(c2);
            if (n1 && n1 === n2) return true;
            if ((c1.length >= 2 && c2.length >= 2) && (c1.startsWith(c2 + '-') || c2.startsWith(c1 + '-'))) return true;
            return false;
        }

        // The sender's saved audio choice: a name only one track in the language has, else the track at
        // the saved position among the language's tracks, else the first with the name or language. Two
        // tracks in one language ("swe"/"swe") are told apart only by the position, which the phone
        // counts the same way in its own list.
        function pickAudioTrack(tracks, language, name, position) {
            const matching = tracks.filter(t => matchLang(t.language, language));
            const named = name ? matching.filter(t => t.name === name) : [];
            if (named.length === 1) return named[0];
            if (position >= 0 && position < matching.length) return matching[position];
            const code = String(language || '').toLowerCase();
            return named[0] || matching.find(t => String(t.language || '').toLowerCase() === code) || matching[0]
                || (name ? tracks.find(t => t.name === name) : undefined);
        }

        let preferredLanguage = '';
        let preferredAudioName = '';
        // Where the chosen track stands among the tracks in its language; -1 when none was picked.
        let preferredAudioIndex = -1;
        let audioPreferenceApplied = false;
        let preferredSubtitle = '';
        let preferredSubtitleName = '';
        let currentIsVod = false;
        let currentVodGateway = false;
        // canDisplayType can answer "no" for a format the TV plays fine (some TVs with built-in
        // Cast report only 1080p to Cast). The answer is kept here and reported to the sender
        // only if playback then fails, instead of refusing the LOAD up front.
        let vodCodecWarning = null;
        let vodCodecWarningTimer = null;
        // Set once the codec message went out for this LOAD: the errors that follow it (905 and
        // so on) must not replace the explanation on the phone.
        let vodCodecReported = false;
        // A live channel reached PLAYING since its LOAD: later errors are not about the codec.
        let livePlayed = false;
        // An older Chromecast given a format it cannot show (1080i) may buffer for good instead of
        // failing. A doubted live format that has not started moving by then counts as a failure.
        const DOUBTED_STALL_MS = 20000;
        let doubtedWatch = null;

        // Anonymous playback reports for the developer (see privacy.html): what was cast (stream,
        // container, codec, resolution), how it went (error code, or played for 20 s) and what this
        // device says it can decode. Never URLs (an Xtream address holds the provider login), titles
        // or channel names. The server keeps only the fields it knows and stores no IP address.
        const REPORT_URL = 'https://easychannel-demo.sharedevil.org/cast-report';
        const REPORT_LIMIT = 40;
        const REPORT_PLAYED_AFTER_MS = 20000;
        const reportSession = Math.random().toString(36).slice(2, 12);
        let reportsSent = 0;
        let reportMedia = null;
        let reportLoadAt = 0;
        let reportStartupMs = undefined;
        let reportFailed = false;
        let reportPlayedTimer = null;
        let reportedErrors = new Set();
        let reportCaps = null;
        function withoutUrls(text) {
            return text == null ? undefined : String(text).replace(/[a-z][a-z0-9+.-]*:\/\/\S+/gi, '<url>').slice(0, 200);
        }
        // Asked once, after the context has started (getDeviceCapabilities is empty before that).
        function deviceCaps() {
            if (reportCaps) return reportCaps;
            const display = (mime, codecs, width, height) => {
                try {
                    return typeof context.canDisplayType === 'function'
                        ? Boolean(context.canDisplayType(mime, codecs, width, height)) : undefined;
                } catch (_) { return undefined; }
            };
            const audio = (codec) => {
                try { return typeof MediaSource !== 'undefined' && MediaSource.isTypeSupported('audio/mp4; codecs="' + codec + '"'); }
                catch (_) { return undefined; }
            };
            let flags = {};
            try { flags = (typeof context.getDeviceCapabilities === 'function' && context.getDeviceCapabilities()) || {}; } catch (_) {}
            const names = (cast.framework.system && cast.framework.system.DeviceCapabilities) || {};
            const flag = (name) => typeof flags[names[name]] === 'boolean' ? flags[names[name]] : undefined;
            reportCaps = {
                hevc: canDecodeHevc(),
                hevc4k: display('video/mp4', 'hev1.1.6.L153.B0', 3840, 2160),
                h264_4k: display('video/mp4', 'avc1.640033', 3840, 2160),
                fullHd: canShowFullHd(),
                // 1080p50/60 H.264 (level 4.2) asked without a size: with fullHd false, a yes means the
                // TV refuses the size, not the codec, and the sender's size-less manifest can play.
                h264_l42: display('video/mp4', 'avc1.64002a'),
                vp9: display('video/webm', 'vp9', 1920, 1080),
                av1: display('video/mp4', 'av01.0.08M.08', 1920, 1080),
                ec3: audio('ec-3'),
                ac3: audio('ac-3'),
                hdr: flag('IS_HDR_SUPPORTED'),
                dv: flag('IS_DV_SUPPORTED')
            };
            return reportCaps;
        }
        function sendReport(kind, details) {
            if (reportsSent >= REPORT_LIMIT) return;
            reportsSent++;
            try {
                const body = JSON.stringify(Object.assign({ kind: kind, receiver: RECEIVER_VERSION, session: reportSession,
                    ua: navigator.userAgent, caps: deviceCaps() }, reportMedia || {}, details || {}));
                // A text/plain beacon needs no CORS preflight and is sent even if the page closes.
                if (navigator.sendBeacon && navigator.sendBeacon(REPORT_URL, body)) return;
                fetch(REPORT_URL, { method: 'POST', body: body, mode: 'no-cors', keepalive: true }).catch(() => {});
            } catch (_) {}
        }
        // One report per kind and error code for each LOAD: a live stream can repeat a segment error.
        function reportPlaybackError(kind, event, critical) {
            if (critical) reportFailed = true;
            const code = Number(event && event.detailedErrorCode);
            const key = kind + ':' + (Number.isFinite(code) ? code : (event && event.reason));
            if (reportedErrors.has(key)) return;
            reportedErrors.add(key);
            sendReport(kind, {
                code: Number.isFinite(code) ? code : undefined,
                reason: withoutUrls(event && event.reason),
                severity: event && typeof event.severity === 'number' ? event.severity : undefined
            });
        }
        function stopDoubtedWatch() {
            if (doubtedWatch) clearInterval(doubtedWatch);
            doubtedWatch = null;
        }
        // Playback failed on a format the device had doubted: say so on the TV and tell the sender.
        // The box stays until the next LOAD, or until the video plays after all.
        function reportCodecFailure(event) {
            const errorPayload = vodCodecWarning;
            reportPlaybackError('codec', event || { reason: errorPayload.type }, true);
            vodCodecWarning = null;
            vodCodecReported = true;
            clearTimeout(vodCodecWarningTimer);
            vodCodecWarningTimer = null;
            stopDoubtedWatch();
            stopVodFrameWatch();
            showOverlay(document.getElementById('channel-title').textContent || 'EasyChannel IPTV', tr('unsupportedCodec'), null, 0);
            errorOverlayShown = true;
            try {
                if (typeof CUSTOM_CHANNEL !== 'undefined') context.sendCustomMessage(CUSTOM_CHANNEL, undefined, errorPayload);
                if (typeof LEGACY_CHANNEL !== 'undefined') context.sendCustomMessage(LEGACY_CHANNEL, undefined, errorPayload);
            } catch (err) {
                (console.warn || console.log || (() => {}))('[EasyChannel IPTV Receiver] Failed to send ' + errorPayload.type + ':', err);
            }
        }
        function watchDoubtedStart() {
            stopDoubtedWatch();
            const started = Date.now();
            let firstTime = null;
            doubtedWatch = setInterval(() => {
                if (vodCodecReported || !vodCodecWarning || currentIsVod) { stopDoubtedWatch(); return; }
                const time = playerManager.getCurrentTimeSec();
                if (firstTime === null && time > 0) firstTime = time;
                if (firstTime !== null && time - firstTime > 2) { stopDoubtedWatch(); return; }
                if (Date.now() - started >= DOUBTED_STALL_MS) {
                    console.log('[EasyChannel IPTV Receiver] doubted live format did not start:', vodCodecWarning);
                    reportCodecFailure();
                }
            }, 1000);
        }
        // A VOD whose format the device doubted can "play" with no picture: an older Chromecast
        // given 4K HEVC decodes only the audio, the clock runs and no error ever comes. Once the
        // clock has run a few seconds, no decoded frame means the video cannot be shown.
        const VOD_NO_FRAMES_AFTER_S = 4;
        let vodFrameWatch = null;
        function stopVodFrameWatch() {
            if (vodFrameWatch) clearInterval(vodFrameWatch);
            vodFrameWatch = null;
        }
        function mediaElement() {
            try {
                const element = typeof playerManager.getMediaElement === 'function' ? playerManager.getMediaElement() : null;
                if (element) return element;
            } catch (_) {}
            const player = document.getElementById('media-player');
            return document.querySelector('video') || (player && player.shadowRoot && player.shadowRoot.querySelector('video')) || null;
        }
        function decodedFrames() {
            const video = mediaElement();
            if (!video) return undefined;
            if (typeof video.getVideoPlaybackQuality === 'function') return video.getVideoPlaybackQuality().totalVideoFrames;
            return typeof video.webkitDecodedFrameCount === 'number' ? video.webkitDecodedFrameCount : undefined;
        }
        function watchVodFrames() {
            stopVodFrameWatch();
            let startTime = null;
            vodFrameWatch = setInterval(() => {
                if (vodCodecReported || !vodCodecWarning || !currentIsVod) { stopVodFrameWatch(); return; }
                const frames = decodedFrames();
                if (frames === undefined || frames > 0) { stopVodFrameWatch(); return; }
                const time = playerManager.getCurrentTimeSec();
                if (startTime === null) startTime = time;
                if (time - startTime >= VOD_NO_FRAMES_AFTER_S) {
                    console.log('[EasyChannel IPTV Receiver] doubted VOD format plays without video frames:', vodCodecWarning);
                    reportCodecFailure();
                }
            }, 1000);
        }
        // Media and load failures that a decoder unable to handle the format produces. Network and
        // segment errors (3xx) are not blamed on the codec: the sender retries those.
        const CODEC_ERROR_CODES = [100, 102, 104, 110, 905];
        // true/false from the device itself, undefined when it cannot be asked. Asked at 1080p
        // (level 4.1): a 1080p-only HEVC device would answer "no" for 4K and be blamed for the codec.
        function canDecodeHevc() {
            try {
                return typeof context.canDisplayType === 'function'
                    ? Boolean(context.canDisplayType('video/mp4', 'hev1.1.6.L123.B0', 1920, 1080)) : undefined;
            } catch (_) { return undefined; }
        }
        // false on a TV that says it cannot show 1080p H.264 (some HD panels with Cast built in). Shaka
        // asks the same question with the size from the manifest and drops a 1080p rendition, so the
        // sender then leaves that size out; the decoder plays 1080p and scales it down.
        function canShowFullHd() {
            try {
                return typeof context.canDisplayType === 'function'
                    ? Boolean(context.canDisplayType('video/mp4', 'avc1.640028', 1920, 1080)) : undefined;
            } catch (_) { return undefined; }
        }
        // undefined = not resolved yet, [] = subtitles off, [id] = the single selected track.
        let vodDesiredTextIds = undefined;
        let vodTextAppliedAt = 0;
        function applyVodAudioPreference() {
            if (!currentIsVod || audioPreferenceApplied || (!preferredLanguage && preferredAudioIndex < 0)) return;
            try {
                const manager = playerManager.getAudioTracksManager();
                const tracks = manager.getTracks() || [];
                const match = pickAudioTrack(tracks, preferredLanguage, preferredAudioName, preferredAudioIndex);
                if (match) {
                    manager.setActiveById(match.trackId);
                    audioPreferenceApplied = true;
                }
            } catch (error) {
                console.warn('[EasyChannel IPTV Receiver] Audio preference pending:', error);
            }
        }
        // Resolve the sender's saved subtitle choice against the tracks CAF has published.
        // Returns undefined while the track list is still empty so the caller can wait.
        function resolveVodTextIds() {
            const manager = playerManager.getTextTracksManager();
            const tracks = manager.getTracks() || [];
            if (preferredSubtitle === 'off' || (!preferredSubtitle && !preferredSubtitleName)) return [];
            const match = tracks.find(t => matchLang(t.language, preferredSubtitle) &&
                (!preferredSubtitleName || t.name === preferredSubtitleName))
                || tracks.find(t => matchLang(t.language, preferredSubtitle))
                || (preferredSubtitleName && tracks.find(t => t.name === preferredSubtitleName));
            return match ? [match.trackId] : undefined;
        }
        // Keep exactly one VOD subtitle track active. Cast can drop or duplicate the text track
        // after a seek or pause, so the user's choice is re-asserted instead of trusting CAF.
        function enforceVodTextSelection(force = false) {
            if (!currentIsVod) return;
            try {
                const manager = playerManager.getTextTracksManager();
                if (vodDesiredTextIds === undefined) {
                    const resolved = resolveVodTextIds();
                    if (resolved === undefined) return;
                    vodDesiredTextIds = resolved;
                }
                const active = (manager.getActiveTracks() || []).map(t => t.trackId);
                const desired = vodDesiredTextIds;
                const same = active.length === desired.length && desired.every(id => active.includes(id));
                // Re-assert a dropped/duplicated selection, but throttle repeats so a lagging
                // active-track report cannot reload the subtitle stream every tick.
                if (force || (!same && Date.now() - vodTextAppliedAt > 4000)) {
                    manager.setActiveByIds(desired);
                    vodTextAppliedAt = Date.now();
                }
            } catch (error) {
                console.warn('[EasyChannel IPTV Receiver] Subtitle preference pending:', error);
            }
        }
        // Overlay line that names the audio and subtitle currently playing on the TV.
        function currentTrackSummary() {
            try {
                const audio = playerManager.getAudioTracksManager().getActiveTrack();
                const audioLabel = audio ? (audio.name || audio.language || 'Standard') : 'Standard';
                const text = (playerManager.getTextTracksManager().getActiveTracks() || [])[0];
                const textLabel = text ? (text.name || text.language || tr('text')) : tr('off');
                return tr('audio') + ': ' + audioLabel + ' · ' + tr('text') + ': ' + textLabel;
            } catch (error) {
                return '';
            }
        }
        // setActiveByIds updates the active-track list asynchronously, so the overlay must wait
        // until Cast reports the requested subtitle selection (otherwise it shows the old/off track).
        function refreshTrackOverlay(attempt = 0) {
            if (!currentIsVod) return;
            const desired = vodDesiredTextIds;
            const active = (playerManager.getTextTracksManager().getActiveTracks() || []).map(t => t.trackId);
            const settled = Array.isArray(desired) && active.length === desired.length && desired.every(id => active.includes(id));
            if (!settled && attempt < 10) {
                setTimeout(() => refreshTrackOverlay(attempt + 1), 200);
                return;
            }
            showOverlay(document.getElementById('channel-title').textContent, currentTrackSummary(), null, 4000);
        }

        // Intercept LOAD request to read metadata and preferred audio
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.LOAD, loadRequestData => {
            console.log('[EasyChannel IPTV Receiver] LOAD RECEIVED', loadRequestData.media?.contentType);
            const media = loadRequestData.media;
            const customData = loadRequestData.customData || media?.customData;
            const isVod = customData?.vod === true;
            currentIsVod = isVod;
            lastTrackSignature = '';
            audioPreferenceApplied = false;
            vodDesiredTextIds = undefined;
            vodTextAppliedAt = 0;
            vodCodecWarning = null;
            clearTimeout(vodCodecWarningTimer);
            vodCodecWarningTimer = null;
            vodCodecReported = false;
            livePlayed = false;
            if (media) {
                if (!isVod && media.contentUrl && media.contentUrl.endsWith('.ts')) {
                    media.contentUrl = media.contentUrl.replace(/\.ts$/, '.m3u8');
                    media.contentType = 'application/x-mpegurl';
                }
                if (!isVod && media.contentId && media.contentId.endsWith('.ts')) {
                    media.contentId = media.contentId.replace(/\.ts$/, '.m3u8');
                    media.contentType = 'application/x-mpegurl';
                }
                media.streamType = isVod ? cast.framework.messages.StreamType.BUFFERED
                    : cast.framework.messages.StreamType.LIVE;
            }

            const metadata = media?.metadata;
            const title = metadata?.title || 'EasyChannel IPTV';
            const logo = metadata?.images?.[0]?.url;
            if (customData && customData.preferredAudio) {
                preferredLanguage = customData.preferredAudio;
            } else {
                preferredLanguage = '';
            }
            preferredAudioName = customData?.preferredAudioName || '';
            preferredAudioIndex = Number.isInteger(customData?.preferredAudioIndex) ? customData.preferredAudioIndex : -1;
            preferredSubtitle = customData?.preferredSubtitle || '';
            preferredSubtitleName = customData?.preferredSubtitleName || '';
            currentLanguage = customData?.language === 'sv' ? 'sv' : 'en';
            currentVodGateway = customData?.vodGateway === true;
            clearTimeout(reportPlayedTimer);
            reportPlayedTimer = null;
            reportLoadAt = Date.now();
            reportStartupMs = undefined;
            reportFailed = false;
            reportedErrors = new Set();
            const positive = (value) => Number(value) > 0 ? Number(value) : undefined;
            const text = (value) => value ? String(value).slice(0, 64) : undefined;
            reportMedia = {
                stream: isVod ? 'vod' : 'live',
                contentType: text(media?.contentType),
                gateway: isVod ? currentVodGateway : undefined,
                videoMime: text(customData?.videoMime),
                videoCodecs: text(customData?.videoCodecs),
                width: positive(customData?.videoWidth),
                height: positive(customData?.videoHeight),
                frameRate: positive(customData?.videoFrameRate),
                interlaced: customData?.videoInterlaced === true ? true : undefined,
                // Sent by newer app versions; reported as they are when present.
                audioCodecs: text(customData?.audioCodecs),
                audioChannels: positive(customData?.audioChannels),
                appVersion: text(customData?.appVersion)
            };

            // Live: the sender names the channel's video codec from its playlist. A device that says
            // no is not trusted up front (see vodCodecWarning); the warning explains a failure that
            // happens before the channel ever plays.
            if (!isVod && customData && customData.videoCodecs && typeof context.canDisplayType === 'function') {
                const codecs = String(customData.videoCodecs);
                const width = Number(customData.videoWidth) > 0 ? Number(customData.videoWidth) : undefined;
                const height = Number(customData.videoHeight) > 0 ? Number(customData.videoHeight) : undefined;
                const frameRate = Number(customData.videoFrameRate) > 0 ? Number(customData.videoFrameRate) : undefined;
                let supported = true;
                try {
                    supported = context.canDisplayType('video/mp4', codecs, width, height, frameRate);
                } catch (e) {
                    (console.warn || console.log || (() => {}))('[EasyChannel IPTV Receiver] canDisplayType check failed:', e);
                }
                // canDisplayType cannot be asked about interlaced video, which an older Chromecast does
                // not show (1080i); the sender marks it, and it is doubted the same way.
                const interlaced = customData.videoInterlaced === true;
                console.log('[EasyChannel IPTV Receiver] live canDisplayType result:', { codecs, width, height, frameRate, interlaced, supported });
                if (!supported || interlaced) {
                    vodCodecWarning = {
                        type: 'LIVE_UNSUPPORTED_CODEC',
                        contentId: media?.contentId || media?.contentUrl || '',
                        codecs: codecs,
                        width: width,
                        height: height,
                        frameRate: frameRate,
                        interlaced: interlaced
                    };
                }
            }
            if (!isVod && vodCodecWarning) watchDoubtedStart(); else stopDoubtedWatch();

            // Validate video codec and resolution against hardware decoder capabilities
            if (isVod && customData && (customData.vodGateway || customData.videoCodecs || customData.videoMime)) {
                const videoMime = customData.videoMime || '';
                let codecs = customData.videoCodecs || '';
                let checkMime = 'video/mp4';
                if (!codecs) {
                    if (videoMime.includes('hevc') || videoMime.includes('h265')) {
                        codecs = 'hev1.1.6.L93.B0';
                    } else if (videoMime.includes('avc') || videoMime.includes('h264')) {
                        codecs = 'avc1.4d401f';
                    } else if (videoMime.includes('vp9')) {
                        checkMime = 'video/webm';
                        codecs = 'vp9';
                    } else if (videoMime.includes('av01') || videoMime.includes('av1')) {
                        codecs = 'av01.0.04M.10';
                    }
                }
                const width = (customData.videoWidth && Number(customData.videoWidth) > 0) ? Number(customData.videoWidth) : undefined;
                const height = (customData.videoHeight && Number(customData.videoHeight) > 0) ? Number(customData.videoHeight) : undefined;

                if (typeof context.canDisplayType === 'function') {
                    let supported = true;
                    try {
                        supported = context.canDisplayType(checkMime, codecs || undefined, width, height);
                    } catch (e) {
                        (console.warn || console.log || (() => {}))('[EasyChannel IPTV Receiver] canDisplayType check failed:', e);
                        supported = true;
                    }
                    console.log('[EasyChannel IPTV Receiver] canDisplayType result:', {
                        checkMime, codecs, width, height, supported
                    });
                    if (!supported) {
                        (console.warn || console.log || (() => {}))('[EasyChannel IPTV Receiver] Device says the video format is unsupported; trying anyway:', {
                            checkMime, codecs, width, height
                        });
                        vodCodecWarning = {
                            type: 'VOD_UNSUPPORTED_CODEC',
                            contentId: media?.contentId || media?.contentUrl || '',
                            mime: videoMime || checkMime,
                            codecs: codecs,
                            width: width,
                            height: height
                        };
                    }
                }
            }

            showOverlay(title, tr('loading'), logo, 8000);
            return loadRequestData;
        });

        // Intercept EDIT_TRACKS_INFO to allow sender to switch audio tracks via standard Cast API
        playerManager.setMessageInterceptor(cast.framework.messages.MessageType.EDIT_TRACKS_INFO, request => {
            console.log('[EasyChannel IPTV Receiver] EDIT_TRACKS_INFO received:', request);
            // The sender switches VOD subtitles through the standard Cast API, so remember the
            // requested text tracks here and keep enforcing exactly that selection afterwards.
            if (currentIsVod && Array.isArray(request.activeTrackIds)) {
                const knownTracks = playerManager.getMediaInformation()?.tracks || [];
                vodDesiredTextIds = request.activeTrackIds.filter(id =>
                    knownTracks.some(mt => mt.trackId === id && mt.type === cast.framework.messages.TrackType.TEXT));
            }
            if (request.activeTrackIds && request.activeTrackIds.length > 0) {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const mediaInfo = playerManager.getMediaInformation();
                const mediaTracks = mediaInfo?.tracks || [];

                for (const wantedId of request.activeTrackIds) {
                    const mTrack = mediaTracks.find(mt => mt.trackId === wantedId);
                    let audioMatch = null;
                    if (mTrack && mTrack.type === cast.framework.messages.TrackType.AUDIO) {
                        // The asked-for id itself first: two tracks in one language can share a name
                        // ("swe"/"swe"), and matching by language and name always found the first one.
                        audioMatch = tracks.find(t => t.trackId === wantedId)
                                  || tracks.find(t => matchLang(t.language, mTrack.language) && t.name === mTrack.name)
                                  || tracks.find(t => matchLang(t.language, mTrack.language));
                    }
                    if (!audioMatch) {
                        audioMatch = tracks.find(t => t.trackId === wantedId);
                    }
                    if (audioMatch) {
                        console.log('[EasyChannel IPTV Receiver] Setting active audio track to ID:', audioMatch.trackId, audioMatch.language);
                        audioManager.setActiveById(audioMatch.trackId);
                        if (currentIsVod) {
                            refreshTrackOverlay();
                        } else {
                            showOverlay(document.getElementById('channel-title').textContent,
                                tr('audio') + ': ' + (audioMatch.name || audioMatch.language || audioMatch.trackId), null, 4000);
                        }
                        broadcastTrackList();
                        const textIds = currentIsVod ? request.activeTrackIds.filter(id =>
                            mediaTracks.some(mt => mt.trackId === id && mt.type === cast.framework.messages.TrackType.TEXT)) : [];
                        request.activeTrackIds = [audioMatch.trackId, ...textIds];
                        break;
                    }
                }
            }
            return request;
        });

        // Event: When media load completes and tracks are available
        playerManager.addEventListener(cast.framework.events.EventType.PLAYER_LOAD_COMPLETE, () => {
            console.log('[EasyChannel IPTV Receiver] PLAYER_LOAD_COMPLETE');
            const audioManager = playerManager.getAudioTracksManager();
            const tracks = audioManager.getTracks() || [];
            console.log('[EasyChannel IPTV Receiver] Found audio tracks:', tracks);

            if (currentIsVod) {
                applyVodAudioPreference();
            } else if (preferredLanguage || preferredAudioIndex >= 0) {
                const normTarget = normalizeLang(preferredLanguage);
                let matchedTrack = pickAudioTrack(tracks, preferredLanguage, preferredAudioName, preferredAudioIndex);
                if (!matchedTrack && preferredLanguage) {
                    matchedTrack = tracks.find(t => {
                        const name = (t.name || '').toLowerCase();
                        return name.includes(preferredLanguage.toLowerCase()) || (normTarget && name.includes(normTarget));
                    });
                }
                if (matchedTrack) {
                    console.log('[EasyChannel IPTV Receiver] Selecting initial audio track by ID:', matchedTrack.trackId, matchedTrack.language);
                    audioManager.setActiveById(matchedTrack.trackId);
                } else if (preferredLanguage) {
                    try {
                        audioManager.setActiveByLanguage(preferredLanguage);
                    } catch (err) {
                        console.warn('[EasyChannel IPTV Receiver] Preferred audio language unavailable:', preferredLanguage, err);
                    }
                }
            }

            const currentActive = audioManager.getActiveTrack();
            const langLabel = currentActive ? (currentActive.name || currentActive.language || 'Standard') : 'Standard';
            if (!currentIsVod) {
                showOverlay(document.getElementById('channel-title').textContent, tr('playing') + ' • ' + langLabel, null, 5000);
            }

            // Send full track list back to Android sender app
            setTimeout(() => { enforceVodTextSelection(true); broadcastTrackList(true); if (currentIsVod) refreshTrackOverlay(); }, 500);
        });

        // Custom Message Channel for direct sender commands
        function handleCustomMessage(event) {
            const data = event.data;
            console.log('[EasyChannel IPTV Receiver] Custom message received:', data);

            if (data.type === 'GET_CAPABILITIES') {
                // Audio the TV's player takes through HLS/DASH (MSE). A Chromecast with Google TV
                // answers no for E-AC-3 and plays it silently even as a plain MP4, so the sender
                // converts that audio for this device instead of sending it as it is.
                const supported = (codec) => {
                    try {
                        return typeof MediaSource !== 'undefined' &&
                            MediaSource.isTypeSupported('audio/mp4; codecs="' + codec + '"');
                    } catch (_) { return false; }
                };
                // hevc false marks an older Chromecast (gen 1-3): the sender then sends stereo audio
                // from the start instead of learning it from error 100 on 5.1 AAC. fullHd false: the
                // sender leaves a 1080p video's size out of the manifest (canShowFullHd).
                const reply = { type: 'CAPABILITIES', ec3: supported('ec-3'), ac3: supported('ac-3'), hevc: canDecodeHevc(),
                    fullHd: canShowFullHd(), lite: LITE_AT_START, receiver: RECEIVER_VERSION };
                console.log('[EasyChannel IPTV Receiver] capabilities:', reply);
                try { context.sendCustomMessage(event.namespace || CUSTOM_CHANNEL, event.senderId, reply); }
                catch (err) { (console.warn || console.log || (() => {}))('[EasyChannel IPTV Receiver] Failed to send capabilities:', err); }
                return;
            }
            if (data.type === 'SELECT_TEXT_TRACK') {
                const manager = playerManager.getTextTracksManager();
                vodDesiredTextIds = data.trackId == null ? [] : [Number(data.trackId)];
                manager.setActiveByIds(vodDesiredTextIds);
                broadcastTrackList(true);
                refreshTrackOverlay();
            } else if (data.type === 'SELECT_AUDIO_TRACK') {
                const manager = playerManager.getAudioTracksManager();
                manager.setActiveById(Number(data.trackId));
                audioPreferenceApplied = true;
                broadcastTrackList(true);
                refreshTrackOverlay();
            } else if (data.type === 'SELECT_TRACK' || data.type === 'SELECT_TRACK_ID') {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                let match = null;

                // Priority 1: Match by exact trackId
                if (data.trackId !== undefined && data.trackId !== null) {
                    match = tracks.find(t => t.trackId === Number(data.trackId));
                }

                // Priority 2: Match by language (+ name if available)
                if (!match && data.language) {
                    match = tracks.find(t => matchLang(t.language, data.language) && (!data.name || t.name === data.name))
                         || tracks.find(t => matchLang(t.language, data.language));
                }

                if (match) {
                    console.log('[EasyChannel IPTV Receiver] Setting active audio track to ID:', match.trackId, match.language, match.name);
                    audioManager.setActiveById(match.trackId);
                    showOverlay(document.getElementById('channel-title').textContent, tr('audio') + ': ' + (match.name || match.language || match.trackId), null, 4000);
                    broadcastTrackList();
                }
            } else if (data.type === 'SELECT_LANGUAGE') {
                const audioManager = playerManager.getAudioTracksManager();
                const tracks = audioManager.getTracks() || [];
                const match = tracks.find(t => matchLang(t.language, data.language));
                if (match) {
                    audioManager.setActiveById(match.trackId);
                } else {
                    try {
                        audioManager.setActiveByLanguage(data.language);
                    } catch (err) {
                        console.warn('[EasyChannel IPTV Receiver] Language unavailable:', data.language, err);
                    }
                }
                broadcastTrackList();
            } else if (data.type === 'QUERY_TRACKS') {
                broadcastTrackList(true);
            }
        }

        // Some VOD containers publish tracks after the initial load callback. Re-assert the
        // chosen audio/subtitle tracks so a seek or pause cannot silently drop or duplicate them.
        setInterval(() => {
            if (currentIsVod) { applyVodAudioPreference(); enforceVodTextSelection(); broadcastTrackList(); }
        }, 1000);

        // A format the device doubted has played for a while: later errors are not about the codec.
        // Counted from the first PLAYING only; seeking or pausing must not keep the warning alive.
        playerManager.addEventListener(cast.framework.events.EventType.PLAYING, () => {
            if (!currentIsVod) livePlayed = true;
            if (reportMedia && reportStartupMs === undefined) {
                reportStartupMs = Date.now() - reportLoadAt;
                const played = reportMedia;
                reportPlayedTimer = setTimeout(() => {
                    if (reportMedia === played && !reportFailed) sendReport('ok', { startupMs: reportStartupMs });
                }, REPORT_PLAYED_AFTER_MS);
            }
            if (errorOverlayShown) {
                errorOverlayShown = false;
                document.getElementById('channel-overlay').classList.remove('visible');
            }
            if (!vodCodecWarning || vodCodecWarningTimer) return;
            if (currentIsVod) watchVodFrames();
            const warning = vodCodecWarning;
            vodCodecWarningTimer = setTimeout(() => {
                if (vodCodecWarning === warning) vodCodecWarning = null;
            }, 15000);
        });

        playerManager.addEventListener(cast.framework.events.EventType.ERROR, (event) => {
            console.error('[EasyChannel IPTV Receiver] PLAYBACK ERROR', {
                detailedErrorCode: event.detailedErrorCode,
                reason: event.reason,
                severity: event.severity,
                error: event.error,
                triggeredByEventType: event.triggeredByEventType
            });
            const errDetail = event.detailedErrorCode || event.reason || tr('unknown');
            const overlayTitle = document.getElementById('channel-title').textContent || 'EasyChannel IPTV';
            if (vodCodecReported) {
                // Follow-up errors of a format failure already explained to the sender.
                return;
            }
            // Live decode failures show up as segment errors (310, 410) as well, so for live any error
            // before the first PLAYING counts once the device has doubted the format.
            const codecFailure = currentIsVod ? CODEC_ERROR_CODES.includes(Number(event.detailedErrorCode))
                : !livePlayed;
            if (vodCodecWarning && codecFailure) {
                reportCodecFailure(event);
                return;
            }
            // A recoverable error (a late live segment, severity ERROR) comes while the channel keeps
            // playing and would leave the box up for good; only a critical error stops playback.
            const severities = cast.framework.events.ErrorSeverity || {};
            const critical = severities.CRITICAL !== undefined ? severities.CRITICAL : 2;
            reportPlaybackError('error', event, event.severity === undefined || event.severity === critical);
            if (event.severity === undefined || event.severity === critical) {
                showOverlay(overlayTitle, tr('error') + ': ' + errDetail, null, 0);
                errorOverlayShown = true;
            }
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'RECEIVER_ERROR',
                    detailedErrorCode: event.detailedErrorCode,
                    reason: event.reason,
                    severity: event.severity,
                    // Lets the sender tell an older Chromecast (no HEVC, no 4K) from a newer one.
                    hevc: canDecodeHevc()
                });
            } catch (_) {}
        });

        window.addEventListener('error', (e) => {
            console.error('[EasyChannel IPTV Receiver] Window error:', e);
            sendReport('window', { message: withoutUrls(e.message) });
            try {
                context.sendCustomMessage(CUSTOM_CHANNEL, undefined, {
                    type: 'WINDOW_ERROR',
                    message: e.message
                });
            } catch (_) {}
        });

        context.addCustomMessageListener(CUSTOM_CHANNEL, handleCustomMessage);
        context.addCustomMessageListener(LEGACY_CHANNEL, handleCustomMessage);

        document.getElementById('channel-status').textContent = tr('connected');

        // Handle remote control keys (e.g. Android TV / Google TV remote Back button)
        window.addEventListener('keydown', (event) => {
            const isBack = event.key === 'BrowserBack' || event.key === 'GoBack' || event.key === 'Back' || event.key === 'Escape' ||
                           event.keyCode === 166 || event.keyCode === 27 || event.keyCode === 4 || event.keyCode === 8 ||
                           event.keyCode === 10009 || event.keyCode === 461;
            if (isBack) {
                console.log('[EasyChannel IPTV Receiver] Remote Back pressed -> stopping receiver');
                event.preventDefault();
                event.stopImmediatePropagation();
                try {
                    context.stop();
                } catch (err) {
                    console.warn('[EasyChannel IPTV Receiver] Failed to stop context:', err);
                    window.close();
                }
            }
        }, { capture: true });

        // Playback configuration for IPTV HLS / TS live streams.
        // NOTE: do NOT enable useShakaForHls. Shaka's HLS parser cannot switch
        // muxed multi-audio tracks (Swedish/English/Finnish etc.), so the TV
        // would always play the default audio. The native Cast HLS player
        // handles the proxy's single-variant muxed TS correctly.
        const playbackConfig = new cast.framework.PlaybackConfig();
        playbackConfig.autoResumeDuration = 5;
        // Chromium caps an H.264 MSE video buffer at 30 MiB on Cast. Gateway VOD segments are 10 s
        // and 4-7 MB, so Shaka's default goal plus 30 s kept behind reaches the cap; appends then
        // fail and playback ends in error 100. An older Chromecast (no HEVC) keeps the total near
        // 25 s. Shaka plays only DASH here (live HLS uses the native player) and reads this when
        // the player is created, so it has to be in the config given to context.start.
        if (LITE_DEVICE) {
            playbackConfig.shakaConfig = { streaming: { bufferingGoal: 10, rebufferingGoal: 2, bufferBehind: 2 } };
            console.log('[EasyChannel IPTV Receiver] older Chromecast: small VOD buffer', playbackConfig.shakaConfig.streaming);
        }

        context.start({
            versionCode: RECEIVER_VERSION,
            playbackConfig: playbackConfig,
            customNamespaces: {
                [CUSTOM_CHANNEL]: cast.framework.system.MessageType.JSON,
                [LEGACY_CHANNEL]: cast.framework.system.MessageType.JSON
            }
        });
        console.log('[EasyChannel IPTV Receiver] Cast Receiver Context started');
        // Once started, canDisplayType answers; an older Chromecast missed above still gets the light
        // overlay. Its buffer stays as set, since Shaka reads it only when the player is created.
        if (!LITE_DEVICE && canDecodeHevc() === false) {
            LITE_DEVICE = true;
            document.body.classList.add('lite');
        }
    </script>
</body>
</html>
